<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">La symbolique des couleurs en communication</title>
  <desc id="desc">Infographie synthetique sur les messages associes aux couleurs en communication de marque.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17131f" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8f5ef"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="960" rx="18" fill="url(#paper)"/>
  <text x="38" y="58" fill="#111528" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800">La symbolique des couleurs en communication</text>
  <text x="38" y="94" fill="#2c2c35" font-family="Arial, Helvetica, sans-serif" font-size="16">Chaque couleur vehicule des emotions et des messages differents.</text>
  <text x="38" y="118" fill="#2c2c35" font-family="Arial, Helvetica, sans-serif" font-size="16">Le choix de ta palette influence la perception de ta marque des le premier regard.</text>
  <g transform="translate(960 20)">
    <rect width="540" height="98" rx="18" fill="#fffaf0" stroke="#ead9b8"/>
    <circle cx="38" cy="49" r="14" fill="none" stroke="#f4aa00" stroke-width="3"/>
    <path d="M31 63h14M34 72h8M38 22v10M24 32l7 7M52 32l-7 7" stroke="#f4aa00" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="32" fill="#17131f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">A retenir</text>
    <text x="76" y="58" fill="#2f2b34" font-family="Arial, Helvetica, sans-serif" font-size="15">La symbolique d'une couleur peut varier selon sa nuance,</text>
    <text x="76" y="80" fill="#2f2b34" font-family="Arial, Helvetica, sans-serif" font-size="15">son intensite et les associations avec d'autres couleurs.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111528">
    <g transform="translate(24 146)" filter="url(#shadow)">
      <rect width="291" height="394" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#0868c8"/>
      <text x="60" y="43" fill="#0868c8" font-size="21" font-weight="800">BLEU</text>
      <rect x="18" y="70" width="255" height="24" rx="12" fill="#e9f3ff"/>
      <text x="28" y="87" fill="#0756a5" font-size="11" font-weight="700">Confiance - Fiabilite - Expertise - Serenite</text>
      <text x="18" y="126" font-weight="700">Le bleu inspire confiance et stabilite.</text>
      <text x="18" y="149" font-weight="700">Il rassure dans les secteurs professionnels,</text>
      <text x="18" y="172" font-weight="700">financiers et technologiques.</text>
      <text x="18" y="226" font-weight="800">Exemples de marques</text>
      <rect x="18" y="246" width="76" height="68" rx="10" fill="#f7fbff" stroke="#e4eaf2"/>
      <rect x="112" y="246" width="76" height="68" rx="10" fill="#f7fbff" stroke="#e4eaf2"/>
      <rect x="206" y="246" width="66" height="68" rx="10" fill="#f7fbff" stroke="#e4eaf2"/>
      <text x="39" y="286" fill="#0868c8" font-size="28" font-weight="800">in</text>
      <text x="130" y="286" fill="#0868c8" font-size="20" font-weight="800">IBM</text>
      <text x="219" y="286" fill="#1d4ea5" font-size="19" font-weight="800">VISA</text>
      <text x="30" y="336" font-size="11">LinkedIn</text>
      <text x="140" y="336" font-size="11">IBM</text>
      <text x="222" y="336" font-size="11">Visa</text>
      <rect x="18" y="356" width="255" height="48" rx="9" fill="#eaf4ff"/>
      <text x="48" y="376" fill="#0756a5" font-size="12" font-weight="700">Ideal pour rassurer, structurer</text>
      <text x="48" y="394" fill="#0756a5" font-size="12" font-weight="700">et transmettre du serieux.</text>
    </g>

    <g transform="translate(323 146)" filter="url(#shadow)">
      <rect width="291" height="394" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#f01616"/>
      <text x="60" y="43" fill="#f01616" font-size="21" font-weight="800">ROUGE</text>
      <rect x="18" y="70" width="242" height="24" rx="12" fill="#fff0f0"/>
      <text x="28" y="87" fill="#d81313" font-size="11" font-weight="700">Energie - Passion - Puissance - Action</text>
      <text x="18" y="126" font-weight="700">Le rouge attire l'attention et cree</text>
      <text x="18" y="149" font-weight="700">un impact emotionnel fort. Il evoque</text>
      <text x="18" y="172" font-weight="700">la passion, l'urgence et l'energie.</text>
      <text x="18" y="226" font-weight="800">Exemples de marques</text>
      <rect x="18" y="246" width="76" height="68" rx="10" fill="#fff8f8" stroke="#eadede"/>
      <rect x="112" y="246" width="76" height="68" rx="10" fill="#fff8f8" stroke="#eadede"/>
      <rect x="206" y="246" width="66" height="68" rx="10" fill="#fff8f8" stroke="#eadede"/>
      <text x="26" y="286" fill="#f01616" font-size="17" font-weight="800">Coca</text>
      <text x="132" y="291" fill="#e10f17" font-size="45" font-weight="900">N</text>
      <text x="221" y="290" fill="#f01616" font-size="21" font-weight="800">▶</text>
      <text x="26" y="336" font-size="11">Coca-Cola</text>
      <text x="128" y="336" font-size="11">Netflix</text>
      <text x="220" y="336" font-size="11">YouTube</text>
      <rect x="18" y="356" width="255" height="48" rx="9" fill="#fff0f0"/>
      <text x="48" y="376" font-size="12" font-weight="700">Ideal pour dynamiser, provoquer</text>
      <text x="48" y="394" font-size="12" font-weight="700">une reaction ou marquer les esprits.</text>
    </g>

    <g transform="translate(622 146)" filter="url(#shadow)">
      <rect width="291" height="394" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#0cae58"/>
      <text x="60" y="43" fill="#0cae58" font-size="21" font-weight="800">VERT</text>
      <rect x="18" y="70" width="240" height="24" rx="12" fill="#edf8f1"/>
      <text x="28" y="87" fill="#0b6a38" font-size="11" font-weight="700">Nature - Equilibre - Sante - Croissance</text>
      <text x="18" y="126" font-weight="700">Le vert est associe a la nature,</text>
      <text x="18" y="149" font-weight="700">au bien-etre et a la croissance.</text>
      <text x="18" y="172" font-weight="700">Il peut evoquer l'innovation.</text>
      <text x="18" y="226" font-weight="800">Exemples de marques</text>
      <rect x="18" y="246" width="76" height="68" rx="10" fill="#f7fff9" stroke="#dfeade"/>
      <rect x="112" y="246" width="76" height="68" rx="10" fill="#f7fff9" stroke="#dfeade"/>
      <rect x="206" y="246" width="66" height="68" rx="10" fill="#f7fff9" stroke="#dfeade"/>
      <text x="28" y="286" fill="#087a46" font-size="16" font-weight="800">Star</text>
      <text x="123" y="286" fill="#0b9d52" font-size="15" font-weight="800">Spotify</text>
      <text x="215" y="286" fill="#087a46" font-size="12" font-weight="800">Body</text>
      <text x="24" y="336" font-size="11">Starbucks</text>
      <text x="126" y="336" font-size="11">Spotify</text>
      <text x="210" y="336" font-size="11">Body Shop</text>
      <rect x="18" y="356" width="255" height="48" rx="9" fill="#eef8f0"/>
      <text x="48" y="376" fill="#0b6a38" font-size="12" font-weight="700">Ideal pour evoquer l'harmonie,</text>
      <text x="48" y="394" fill="#0b6a38" font-size="12" font-weight="700">la durabilite et le responsable.</text>
    </g>

    <g transform="translate(921 146)" filter="url(#shadow)">
      <rect width="291" height="394" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#f5bc00"/>
      <text x="60" y="43" fill="#f5ad00" font-size="21" font-weight="800">JAUNE</text>
      <rect x="18" y="70" width="255" height="24" rx="12" fill="#fff7d9"/>
      <text x="28" y="87" fill="#e09b00" font-size="11" font-weight="700">Optimisme - Creativite - Joie - Accessibilite</text>
      <text x="18" y="126" font-weight="700">Le jaune evoque la joie, la lumiere</text>
      <text x="18" y="149" font-weight="700">et l'energie positive. Il attire l'oeil</text>
      <text x="18" y="172" font-weight="700">et transmet une image chaleureuse.</text>
      <text x="18" y="226" font-weight="800">Exemples de marques</text>
      <rect x="18" y="246" width="76" height="68" rx="10" fill="#fffdf2" stroke="#eee3c2"/>
      <rect x="112" y="246" width="76" height="68" rx="10" fill="#fffdf2" stroke="#eee3c2"/>
      <rect x="206" y="246" width="66" height="68" rx="10" fill="#fffdf2" stroke="#eee3c2"/>
      <text x="32" y="286" fill="#0a55b8" font-size="17" font-weight="800">IKEA</text>
      <text x="126" y="286" fill="#17131f" font-size="17" font-weight="800">Nikon</text>
      <text x="218" y="286" fill="#17131f" font-size="14" font-weight="800">Snap</text>
      <text x="40" y="336" font-size="11">IKEA</text>
      <text x="133" y="336" font-size="11">Nikon</text>
      <text x="214" y="336" font-size="11">Snapchat</text>
      <rect x="18" y="356" width="255" height="48" rx="9" fill="#fff7df"/>
      <text x="48" y="376" fill="#7d5700" font-size="12" font-weight="700">Ideal pour communiquer la bonne</text>
      <text x="48" y="394" fill="#7d5700" font-size="12" font-weight="700">humeur, la creativite et la proximite.</text>
    </g>

    <g transform="translate(1220 146)" filter="url(#shadow)">
      <rect width="291" height="394" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#ff6b00"/>
      <text x="60" y="43" fill="#ff6b00" font-size="21" font-weight="800">ORANGE</text>
      <rect x="18" y="70" width="245" height="24" rx="12" fill="#fff1e7"/>
      <text x="28" y="87" fill="#e95d00" font-size="11" font-weight="700">Convivialite - Enthousiasme - Mouvement</text>
      <text x="18" y="126" font-weight="700">L'orange combine energie et chaleur.</text>
      <text x="18" y="149" font-weight="700">Il cree une sensation de dynamisme</text>
      <text x="18" y="172" font-weight="700">et de proximite.</text>
      <text x="18" y="226" font-weight="800">Exemples de marques</text>
      <rect x="18" y="246" width="76" height="68" rx="10" fill="#fff8f3" stroke="#eadfda"/>
      <rect x="112" y="246" width="76" height="68" rx="10" fill="#fff8f3" stroke="#eadfda"/>
      <rect x="206" y="246" width="66" height="68" rx="10" fill="#fff8f3" stroke="#eadfda"/>
      <text x="28" y="286" fill="#ff6b00" font-size="15" font-weight="800">orange</text>
      <text x="127" y="286" fill="#ff6b00" font-size="17" font-weight="800">Fanta</text>
      <text x="222" y="286" fill="#d8611c" font-size="18" font-weight="800">Etsy</text>
      <text x="34" y="336" font-size="11">Orange</text>
      <text x="132" y="336" font-size="11">Fanta</text>
      <text x="224" y="336" font-size="11">Etsy</text>
      <rect x="18" y="356" width="255" height="48" rx="9" fill="#fff0e7"/>
      <text x="48" y="376" fill="#823500" font-size="12" font-weight="700">Ideal pour paraitre accessible,</text>
      <text x="48" y="394" fill="#823500" font-size="12" font-weight="700">chaleureux et plein d'energie.</text>
    </g>

    <g transform="translate(24 552)" filter="url(#shadow)">
      <rect width="291" height="334" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#854ee7"/>
      <text x="60" y="43" fill="#854ee7" font-size="21" font-weight="800">VIOLET</text>
      <rect x="18" y="70" width="255" height="24" rx="12" fill="#f4edff"/>
      <text x="28" y="87" fill="#713bd4" font-size="11" font-weight="700">Creativite - Imagination - Spiritualite</text>
      <text x="18" y="126" font-weight="700">Le violet lie imagination, creativite</text>
      <text x="18" y="149" font-weight="700">et sagesse avec elegance.</text>
      <text x="18" y="202" font-weight="800">Exemples : Twitch, Milka, Cadbury</text>
      <rect x="18" y="262" width="255" height="48" rx="9" fill="#f5efff"/>
      <text x="48" y="282" fill="#5b2fb0" font-size="12" font-weight="700">Ideal pour se differencier</text>
      <text x="48" y="300" fill="#5b2fb0" font-size="12" font-weight="700">et exprimer l'intuition.</text>
    </g>

    <g transform="translate(323 552)" filter="url(#shadow)">
      <rect width="291" height="334" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#ef4b8b"/>
      <text x="60" y="43" fill="#ef4b8b" font-size="21" font-weight="800">ROSE</text>
      <rect x="18" y="70" width="245" height="24" rx="12" fill="#fff0f6"/>
      <text x="28" y="87" fill="#df2f76" font-size="11" font-weight="700">Douceur - Bienveillance - Modernite</text>
      <text x="18" y="126" font-weight="700">Le rose exprime douceur, attention</text>
      <text x="18" y="149" font-weight="700">et sensibilite. Selon sa nuance,</text>
      <text x="18" y="172" font-weight="700">il peut etre audacieux ou delicat.</text>
      <text x="18" y="202" font-weight="800">Exemples : Airbnb, Glossier, Dribbble</text>
      <rect x="18" y="262" width="255" height="48" rx="9" fill="#fff0f6"/>
      <text x="48" y="282" fill="#9f2857" font-size="12" font-weight="700">Ideal pour creer une image douce,</text>
      <text x="48" y="300" fill="#9f2857" font-size="12" font-weight="700">bienveillante ou contemporaine.</text>
    </g>

    <g transform="translate(622 552)" filter="url(#shadow)">
      <rect width="291" height="334" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#733205"/>
      <text x="60" y="43" fill="#733205" font-size="21" font-weight="800">MARRON</text>
      <rect x="18" y="70" width="242" height="24" rx="12" fill="#f5ece5"/>
      <text x="28" y="87" fill="#5c2a0b" font-size="11" font-weight="700">Authenticite - Naturel - Ancrage</text>
      <text x="18" y="126" font-weight="700">Le marron evoque la terre, le bois,</text>
      <text x="18" y="149" font-weight="700">les matieres brutes et le savoir-faire.</text>
      <text x="18" y="202" font-weight="800">Exemples : Nespresso, Hershey's</text>
      <rect x="18" y="262" width="255" height="48" rx="9" fill="#f4ece5"/>
      <text x="48" y="282" fill="#5c2a0b" font-size="12" font-weight="700">Ideal pour l'authenticite,</text>
      <text x="48" y="300" fill="#5c2a0b" font-size="12" font-weight="700">le savoir-faire et la naturalite.</text>
    </g>

    <g transform="translate(921 552)" filter="url(#shadow)">
      <rect width="291" height="334" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#090909"/>
      <text x="60" y="43" fill="#17131f" font-size="21" font-weight="800">NOIR</text>
      <rect x="18" y="70" width="245" height="24" rx="12" fill="#efefef"/>
      <text x="28" y="87" fill="#17131f" font-size="11" font-weight="700">Elegance - Autorite - Luxe</text>
      <text x="18" y="126" font-weight="700">Le noir apporte contraste, prestige</text>
      <text x="18" y="149" font-weight="700">et sophistication. Il sert souvent</text>
      <text x="18" y="172" font-weight="700">les univers premium.</text>
      <text x="18" y="202" font-weight="800">Exemples : Apple, Nike, Chanel</text>
      <rect x="18" y="262" width="255" height="48" rx="9" fill="#f0f0f0"/>
      <text x="48" y="282" fill="#17131f" font-size="12" font-weight="700">Ideal pour les marques haut de gamme,</text>
      <text x="48" y="300" fill="#17131f" font-size="12" font-weight="700">elegantes et intemporelles.</text>
    </g>

    <g transform="translate(1220 552)" filter="url(#shadow)">
      <rect width="291" height="334" rx="14" fill="#ffffff" stroke="#e8e3da"/>
      <circle cx="34" cy="36" r="15" fill="#ffffff" stroke="#d6d6d6"/>
      <text x="60" y="43" fill="#222222" font-size="21" font-weight="800">BLANC &amp; CLAIRS</text>
      <rect x="18" y="70" width="242" height="24" rx="12" fill="#f3f3f3"/>
      <text x="28" y="87" fill="#4a4a4a" font-size="11" font-weight="700">Simplicite - Clarte - Purete</text>
      <text x="18" y="126" font-weight="700">Les tons clairs creent de l'espace</text>
      <text x="18" y="149" font-weight="700">et mettent en valeur les autres</text>
      <text x="18" y="172" font-weight="700">elements de la marque.</text>
      <text x="18" y="202" font-weight="800">Exemples : Muji, L'Oreal, Dove</text>
      <rect x="18" y="262" width="255" height="48" rx="9" fill="#f4f4f4"/>
      <text x="48" y="282" fill="#4a4a4a" font-size="12" font-weight="700">Ideal pour exprimer la simplicite,</text>
      <text x="48" y="300" fill="#4a4a4a" font-size="12" font-weight="700">la clarte et la modernite.</text>
    </g>
  </g>

  <g transform="translate(24 904)">
    <rect width="1488" height="38" rx="16" fill="#fff9ee" stroke="#ead9b8"/>
    <text x="30" y="25" fill="#111528" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">Conseil</text>
    <text x="96" y="25" fill="#2c2c35" font-family="Arial, Helvetica, sans-serif" font-size="14">Observe les couleurs qui t'attirent naturellement : elles revelent souvent ce qui te ressemble et l'univers que tu veux creer.</text>
    <text x="1200" y="25" fill="#17131f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Fais confiance a tes ressentis !</text>
  </g>
</svg>
